<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 204"><title>Two paths add at zero and cancel at one.</title><text x="60" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#006c70">Input</text><text x="235" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#006c70">After H</text><text x="445" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#006c70">After H again</text><path d="M82 104 L209 66" stroke="#006c70" stroke-width="2" fill="none"/><path d="M82 104 L209 154" stroke="#006c70" stroke-width="2" fill="none"/><path d="M258 66 L411 67" stroke="#006c70" stroke-width="2" fill="none"/><path d="M258 154 L411 67" stroke="#006c70" stroke-width="2" fill="none"/><path d="M258 66 L411 153" stroke="#006c70" stroke-width="2" fill="none"/><path d="M258 154 L411 153" stroke="#992d44" stroke-width="2" fill="none"/><text x="60" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#28363a">|0⟩</text><text x="233" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#28363a">|0⟩</text><text x="233" y="161" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#28363a">|1⟩</text><text x="442" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#28363a">|0⟩</text><text x="442" y="161" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#28363a">|1⟩</text><text x="440" y="99" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#006c70">½ + ½ = 1</text><text x="440" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#992d44">½ − ½ = 0</text></svg>